# Deepfake Detector Training Configuration

model:
  name: "deepfake_detector"
  architecture: "cnn"  # cnn, light, rawnet2
  input_dim: 80
  embedding_dim: 256
  dropout: 0.5
  use_se: true
  channels: [32, 64, 128, 256]

data:
  train_manifest: "data/train_manifest.json"
  val_manifest: "data/val_manifest.json"
  batch_size: 32
  num_workers: 4
  sample_rate: 16000
  max_duration: 10.0  # seconds
  augmentations:
    noise:
      prob: 0.5
      snr_range: [5, 20]
    reverb:
      prob: 0.3
    time_mask:
      prob: 0.5
      max_mask_pct: 0.1
    freq_mask:
      prob: 0.5
      max_mask_bins: 10

training:
  epochs: 50
  lr: 0.001
  weight_decay: 0.0001
  optimizer: "adamw"
  scheduler: "cosine"
  warmup_epochs: 5
  grad_clip: 1.0
  early_stopping:
    patience: 10
    min_delta: 0.001

loss:
  type: "cross_entropy"
  label_smoothing: 0.1

logging:
  log_dir: "logs/detector"
  checkpoint_dir: "checkpoints/detector"
  save_every: 5
  log_every: 100

evaluation:
  metrics: ["accuracy", "precision", "recall", "f1", "eer"]
  test_sets: ["asv2019", "wavefake", "in_the_wild"]
